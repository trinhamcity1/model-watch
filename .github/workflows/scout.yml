name: Weekly model scout
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scout/scout.py
      - name: Commit candidates
        run: |
          git config user.name "model-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/candidates.json
          git diff --cached --quiet || git commit -m "Update candidate list" && git push
